{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="text-center mb-4">
          <img
            src="{{ url_for('static', filename='images/referent-logo.png') }}"
            alt="Referent logo"
            class="img-fluid"
            style="max-height: 80px;"
          >
        </div>
        <h1 class="h4 text-center mb-4">{{ login_title }}</h1>
        <form method="post" novalidate>
          {{ csrf_input }}
          {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
          {% endif %}
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              autocomplete="username"
              required
              autofocus
            >
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary">Sign in</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
